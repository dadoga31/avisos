name: APK de Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/app-gestion-avisos-408zhn
    paths:
      - 'android/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk avisos.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: avisos-apk
          path: avisos.apk
          if-no-files-found: error

      - name: Publicar en la release «apk»
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk avisos.apk \
            --title "Avisos · última APK" \
            --notes "APK generada automáticamente desde ${{ github.sha }}. Descarga avisos.apk e instálala en el móvil." \
            --target "${{ github.sha }}"
