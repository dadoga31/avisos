plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

/* App nativa: Kotlin + Jetpack Compose + Material 3. El diseño aprobado está
   en diseno/ (maquetas, paleta e icono). */
android {
    namespace 'io.github.dadoga31.avisos'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.dadoga31.avisos'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '3.4.0'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/depuracion.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    /* Los dos jars de JavaMail traen la misma licencia y el mismo pom, y
       el empaquetado no sabe con cuál quedarse. Se quitan solo esos: los
       ficheros mailcap, javamail.* y services/ tienen que seguir dentro,
       porque son los que usa JavaMail para encontrar sus proveedores. */
    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/maven/**',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    /* Pruebas en la JVM con Robolectric: reglas de negocio y capturas de las
       pantallas de verdad (Roborazzi), sin emulador. */
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'roborazzi.test.record', 'true'
                systemProperty 'roborazzi.output.dir', rootProject.file('../diseno/capturas-app').absolutePath
                maxHeapSize = '2g'
            }
        }
    }

    /* assembleRelease ejecuta lintVitalRelease y cualquier aviso suyo tumba
       la compilación. Para una app que se instala a mano no compensa: los
       errores de código los caza el compilador. */
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

/* Los esquemas de Room también van a las pruebas: así se comprueba que la
   migración conserva los avisos de quien actualiza. */
/* Robolectric solo ve los assets de la variante debug (no van en la APK de release). */
android.sourceSets.debug.assets.srcDirs += files("$projectDir/schemas")

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Desenfoque detrás del menú flotante (cristal), Android 12+; antes, fondo translúcido
    implementation 'dev.chrisbanes.haze:haze:1.0.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lectura del buzón: IMAP con IDLE, POP3 y análisis de los mensajes
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Contraseña del correo en el almacén cifrado del sistema
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.36.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.36.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.36.0'
}
