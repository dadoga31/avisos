plugins {
    id 'com.android.application'
}

/* La web es la misma que se publica en GitHub Pages: se copia tal cual
   dentro de la app para que funcione sin red y sin servidor. */
def raizWeb = rootProject.file('..')
def destinoWeb = layout.buildDirectory.dir('webAssets').get().asFile

tasks.register('copiarWeb', Copy) {
    from(raizWeb) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'assets/**'
        exclude '.git/**'
        exclude 'android/**'
    }
    into new File(destinoWeb, 'www')
}

android {
    namespace 'io.github.dadoga31.avisos'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.dadoga31.avisos'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.4.2'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/depuracion.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [destinoWeb]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /* Los dos jars de JavaMail traen la misma licencia y el mismo pom, y
       el empaquetado no sabe con cuál quedarse. Se quitan solo esos: los
       ficheros mailcap, javamail.* y services/ tienen que seguir dentro,
       porque son los que usa JavaMail para encontrar sus proveedores. */
    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/maven/**'
            ]
        }
    }

    /* assembleRelease ejecuta lintVitalRelease y cualquier aviso suyo tumba
       la compilación. Para una app que se instala a mano no compensa: los
       errores de código los caza el compilador. */
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.named('preBuild') { dependsOn 'copiarWeb' }

tasks.configureEach { tarea ->
    if (tarea.name.startsWith('merge') && tarea.name.endsWith('Assets')) {
        tarea.dependsOn 'copiarWeb'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'

    // Lectura del buzón: IMAP con IDLE, POP3 y análisis de los mensajes
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Contraseña del correo en el almacén cifrado del sistema
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
