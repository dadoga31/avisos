<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avisos · Gestión de instalaciones</title>
<meta name="description" content="Gestión de avisos para instaladores de sistemas de seguridad. Funciona sin conexión.">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avisos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <button class="iconbtn topbar__back" id="btnBack" type="button" aria-label="Volver" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar__titles">
        <h1 class="topbar__title" id="topTitle">Agenda</h1>
        <p class="topbar__sub" id="topSub"></p>
      </div>
      <div class="topbar__actions" id="topActions"></div>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <button class="fab" id="fab" type="button" aria-label="Nuevo aviso">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <a class="tab" href="#/agenda" data-tab="agenda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Agenda</span>
    </a>
    <a class="tab" href="#/avisos" data-tab="avisos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Avisos</span>
      <em class="tab__badge" id="badgeAbiertos" hidden></em>
    </a>
    <a class="tab" href="#/historico" data-tab="historico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z"/><path d="M2.5 4h19v3h-19z"/><path d="m9 13 2 2 4-4"/></svg>
      <span>Hechos</span>
    </a>
    <a class="tab" href="#/equipo" data-tab="equipo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><path d="M16 5.5a3 3 0 010 5.4M17.5 20c0-2.6-1-4.3-2.5-5.2"/></svg>
      <span>Equipo</span>
    </a>
    <a class="tab" href="#/ajustes" data-tab="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 4.5l1.9 1.9M17.6 17.6l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.5 19.5l1.9-1.9M17.6 6.4l1.9-1.9"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__head">
      <h2 id="sheetTitle">·</h2>
      <button class="iconbtn" type="button" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/nativo.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ics.js"></script>
<script src="assets/js/correo.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/swipe.js"></script>
<script src="assets/js/visor.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
